# CI: macOS / Ubuntu / Windows 运行 check、lint、测试；Bun Windows 不跑浏览器测试
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Install Playwright Chromium
        run: npx playwright@1.58.2 install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Linux)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Install Playwright Chromium
        run: npx playwright@1.58.2 install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Install Playwright Chromium
        run: npx playwright@1.58.2 install chromium

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  test-linux-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.58.2 install chromium
        timeout-minutes: 5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Bun, Linux)
        run: bun test tests/

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.58.2 install chromium
        timeout-minutes: 5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Bun, macOS)
        run: bun test tests/

  test-windows-bun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (Bun)
        run: bun install

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5

      - name: Cache Deno dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      # Bun on Windows: skip browser tests (chromium.launch() known to hang, see oven-sh/bun#15679).
      # Deno on Windows (test-windows) already covers browser; here run only server-side tests.
      - name: Test (Bun, Windows, no browser)
        shell: pwsh
        run: bun test tests/mod.test.ts
        timeout-minutes: 10
