# CI: 在 macOS、Ubuntu、Windows 上运行 Deno / Bun / Node 三端测试，验证跨运行时兼容性
# logger 含 client.test.ts（依赖 @dreamer/esbuild 打包 + Chromium），
# 故 Deno/Bun CI 安装 Chromium 跑全部用例；Node CI 仅跑 mod.test.ts（无 Chromium）。
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 工作流级 env：让基于 Node 的 GitHub Actions（如 checkout、setup-*）提前使用 Node 24 运行时，
# 便于在官方强制升级前做性能/稳定性验证。参见 GitHub 文档中的 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Deno 三平台测试（linux 同时负责 check / lint）
  # ─────────────────────────────────────────────────────────────
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/ 2>/dev/null || true

      - name: Check
        run: deno check src/ tests/

      - name: Lint
        run: deno lint

      - name: Test (Deno)
        run: deno test -A --no-check tests/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/ 2>/dev/null || true

      - name: Test (Deno, macOS)
        run: deno test -A --no-check tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium

      - name: Cache dependencies
        run: deno cache src/mod.ts src/client/mod.ts tests/

      - name: Test (Deno, Windows)
        run: deno test -A --no-check tests/

  # ─────────────────────────────────────────────────────────────
  # Bun 三平台测试
  # logger 有运行时依赖（runtime-adapter, service）；bun install 解析 package.json
  # ─────────────────────────────────────────────────────────────
  test-linux-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium
        timeout-minutes: 5

      - name: Test (Bun)
        run: bun test tests/

  test-macos-bun:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      - name: Install Playwright Chromium
        run: npx playwright@1.59.1 install chromium
        timeout-minutes: 5

      - name: Test (Bun, macOS)
        run: bun test tests/

  test-windows-bun:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (Bun)
        run: bun install

      # Windows 上 Bun 存在已知 bug（chromium.launch() 卡住不返回，见 oven-sh/bun#15679），
      # 故此处仅跑非 browser 用例（mod.test.ts）；browser 用例由上方 test-windows (Deno) 覆盖。
      - name: Test (Bun, Windows, no browser)
        run: bun test tests/mod.test.ts
        timeout-minutes: 10

  # ─────────────────────────────────────────────────────────────
  # Node.js 三平台测试
  # test:node 脚本：tsx --tsconfig tsconfig.json --test --test-force-exit tests/mod.test.ts
  #   - tsx 作为 TypeScript loader，驱动 Node 原生 node:test runner
  #   - 仅跑 mod.test.ts（非 browser 用例），browser 用例依赖 Chromium + @dreamer/esbuild
  #   - Node CI 不安装 Chromium，符合 Node 兼容规范
  # ─────────────────────────────────────────────────────────────
  test-linux-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node)
        run: npm run test:node
        timeout-minutes: 10

  test-macos-node:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node, macOS)
        run: npm run test:node
        timeout-minutes: 10

  test-windows-node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (Node)
        run: npm install

      - name: Test (Node, Windows)
        run: npm run test:node
        timeout-minutes: 10
